---
layout: default
---

<div style="background-color: var(--card-bg); border-radius: 10px; padding: 20px; margin-bottom: 30px; border: 1px solid var(--card-border-color); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);">
  <h3 style="margin-top: 0; color: var(--heading-color); margin-bottom: 15px;">欢迎来到我的博客</h3>
  
  <p style="line-height: 1.8; color: var(--text-color); margin-bottom: 15px;">
    我是 Sophie，男朋友 <strong>@艾因Ayn</strong>
  </p >
  
  <p style="line-height: 1.8; color: var(--text-color); margin-bottom: 15px;">
    喜欢旅游、凯尔特音乐、中世纪西幻
  </p >
  
  <p style="line-height: 1.8; color: var(--text-color); margin-bottom: 0;">
    专心经营自己的老鼠人生活，随缘发点男朋友、旅游照片及无用杂记
  </p >
</div>

<!-- 文章标题链接列表，用的是 Jekyll 原生语法，100%不会报错 -->
<div class="post-list" style="margin-top: 20px;">
  {% for post in site.posts %}
    <div style="margin-bottom: 15px;">
      {{ post.title }}
    </div>
  {% endfor %}
</div>
